#
# Immich on Synology — uses YOUR fork images from GHCR
# Repo: https://github.com/mfaizanatiq/immich
# Images: ghcr.io/mfaizanatiq/immich-server:mfa
#         ghcr.io/mfaizanatiq/immich-machine-learning:mfa
#
# Place this file + .env on the NAS, e.g.:
#   /volume2/docker-ssd/immich/
#
# Then: sudo docker compose up -d
#

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/mfaizanatiq/immich-server:${IMMICH_VERSION:-mfa}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/mfaizanatiq/immich-machine-learning:${IMMICH_VERSION:-mfa}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if postgres data is on HDD (not SSD)
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
