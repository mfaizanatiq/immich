# Builds Immich images from this fork and pushes to YOUR GHCR.
# Upstream docker.yml needs Immich org secrets/runners — it will not work on a personal fork.
name: Build custom images

on:
  push:
    branches: [mfa]
    paths:
      - 'server/**'
      - 'web/**'
      - 'i18n/**'
      - 'open-api/**'
      - 'packages/**'
      - 'machine-learning/**'
      - '.github/workflows/build-custom-images.yml'
  workflow_dispatch:
    inputs:
      build_server:
        description: Build immich-server
        type: boolean
        default: true
      build_ml:
        description: Build immich-machine-learning (cpu)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Synology DS920+ is amd64
  PLATFORMS: linux/amd64

jobs:
  server:
    if: ${{ github.event_name == 'push' || inputs.build_server }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/immich-server
          tags: |
            type=raw,value=mfa
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEVICE=cpu
          cache-from: type=gha,scope=immich-server
          cache-to: type=gha,mode=max,scope=immich-server

  machine-learning:
    if: ${{ github.event_name == 'push' || inputs.build_ml }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/immich-machine-learning
          tags: |
            type=raw,value=mfa
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push machine-learning
        uses: docker/build-push-action@v6
        with:
          context: machine-learning
          file: machine-learning/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEVICE=cpu
          cache-from: type=gha,scope=immich-ml
          cache-to: type=gha,mode=max,scope=immich-ml
